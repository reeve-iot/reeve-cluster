name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - run: dotnet build Reeve.Cluster.slnx -c Release
      - run: dotnet test tests/Reeve.Cluster.Tests -c Release --no-build
      - run: dotnet test tests/Reeve.Cluster.ArchitectureTests -c Release --no-build

  linearizability-checker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/linearizability-checker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tests/linearizability-checker/go.mod
      - run: go test ./...
