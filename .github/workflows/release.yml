name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/integration.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Extract the release notes
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " { if (found) exit; found = index($0, "## " v " ") == 1; next } found' \
            CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md
      - run: dotnet build Reeve.Cluster.slnx -c Release /p:Version=$VERSION
      - run: dotnet test tests/Reeve.Cluster.Tests -c Release --no-build
      - run: dotnet test tests/Reeve.Cluster.ArchitectureTests -c Release --no-build
      - run: dotnet pack Reeve.Cluster.slnx -c Release -o artifacts/nupkg --no-build /p:Version=$VERSION
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: >
          dotnet nuget push "artifacts/nupkg/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Reeve.Cluster $VERSION" --notes-file release-notes.md
